# github pages serves this repo from the main branch, root folder,
# so README.md is the home page (via the jekyll-readme-index plugin,
# which pages enables by default).  The tutorials need no front
# matter: jekyll-optional-front-matter renders them anyway, and
# jekyll-relative-links rewrites their .md links to .html.  The
# pycco output has no front matter, so jekyll copies it untouched --
# which is what keeps its {{ }} out of liquid's hands.
# a project page lives at timm.github.io/tab, so every generated
# link needs that prefix; without it they point at the host root.
baseurl: /tab
# the h1 becomes the page title, so drop it from the body or every
# page shows its name twice.
titles_from_headings:
  strip_title: true
title: tab
description: a good guess from a few dozen labels
theme: minima

# pages turns these on by default; naming them lets `jekyll build`
# reproduce the live site locally.
plugins: [jekyll-readme-index, jekyll-optional-front-matter,
          jekyll-relative-links, jekyll-default-layout,
          jekyll-titles-from-headings]
exclude: [",/", bin, etc, Makefile, "*.lua", "*.rockspec"]
