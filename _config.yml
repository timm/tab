# Pages serves this from main, root folder, so README.md is the home
# page.  Everything else is markdown too, which means github.com
# renders it the moment it is pushed, without waiting for a build.
# Of the settings below, only the first three change the build:
# without a theme the site has no css at all; without a baseurl the
# links point at the host root, not at the project; and the theme
# prints the title that strip_title takes out of the body.
baseurl:     /tab
theme:       minima
titles_from_headings: {strip_title: true}

title:       tab
description: a good guess from a few dozen labels

# Pages turns these five on by default, so this line is only here to
# let a local `jekyll build` reproduce the live site.
plugins: [jekyll-readme-index, jekyll-optional-front-matter,
          jekyll-relative-links, jekyll-default-layout,
          jekyll-titles-from-headings]
exclude: [",/", bin, etc, Makefile, "*.lua", "*.rockspec"]
